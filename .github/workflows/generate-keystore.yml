name: Generate Keystore
on: [workflow_dispatch]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias mtktool \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=MtkTool, OU=Dev, O=Dev, L=TLV, S=TLV, C=IL"
          
      - name: Convert to Base64
        run: base64 -w0 release.keystore > keystore.txt
      
      - name: Upload Base64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore.txt
